name: ServerMenu
version: 1.10.0
main: fr.loris.servermenu.ServerMenu
bootstrapper: fr.loris.servermenu.ServerMenuBootstrap
api-version: '1.21.11'
author: Loris
description: DonutSMP-style pause menu with configurable nested dialogs.
dependencies:
